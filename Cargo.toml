[package]
name = "pv-unlocker"
version = "0.9.1"
description = "A tool to get information and unloack files generated by FactoryTalk View"
authors = ["Vadoola <github: vadoola>"]
edition = "2024"
readme = "README.md"
repository = "https://github.com/Vadoola/pv-unlocker/"
license = "MIT"
#rust-version = "1.74.1"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
slint = "1.14.1"
ab_versions = {git = "https://github.com/Vadoola/ab_versions_rs.git", tag = "v0.10.1"}
clap = { version = "4.5", features = ["derive"] }
rayon = "1.11"
wild = "2.2"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
log = "0.4"
simplelog = "0.12.2"
#tracing = "0.1"
#tracing-subscriber = { version = "0.3", features = ["env-filter"] }

#is it worth swapping the fluent style icons for lucide?
#lucide-slint = "0.1.4"

[build-dependencies]
slint-build = "1.14.1"

[profile.release]
#https://github.com/johnthagen/min-sized-rust
strip = true
opt-level = "z"
lto = true
codegen-units = 1
#panic = "abort"

[target.'cfg(windows)'.build-dependencies]
windres = "0.2.2"
