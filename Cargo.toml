[package]
name = "pv-unlocker"
version = "0.9.1"
description = "A tool to get information and unloack files generated by FactoryTalk View"
authors = ["Vadoola <github: vadoola>"]
edition = "2024"
readme = "README.md"
repository = "https://github.com/Vadoola/pv-unlocker/"
license = "MIT"
#rust-version = "1.74.1"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
slint = "1.14.1"
ab_versions = {git = "https://github.com/Vadoola/ab_versions_rs.git", tag = "v0.10.1"}
clap = { version = "4.5", features = ["derive"] }
rayon = "1.11"
wild = "2.2"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
directories = "6.0"
log = "0.4"
flexi_logger = "0.31"

#is it worth swapping the fluent style icons for lucide?
#lucide-slint = "0.1.4"

[target.'cfg(unix)'.dependencies]
syslog = "7.0.0"
systemd-journal-logger = "2.2.2"

#Not using Windows Event Logging for now. See note in setup::logging Windows section for more information
#[target.'cfg(windows)'.dependencies]
#win_etw_macros = "0.1"
#win_etw_provider = "0.1"

[build-dependencies]
slint-build = "1.14.1"

[profile.release]
#https://github.com/johnthagen/min-sized-rust
strip = true
opt-level = "z"
lto = true
codegen-units = 1
#panic = "abort"

[target.'cfg(windows)'.build-dependencies]
windres = "0.2.2"
